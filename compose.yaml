services:
    app:
        build: .
        container_name: enem-study-api
        restart: unless-stopped
        environment:
            APP_NAME: enem-study-api
            APP_ENV: production
            APP_DEBUG: "false"
            APP_KEY: ${APP_KEY:?APP_KEY is required}
            APP_URL: http://localhost:${APP_PORT:-8080}
            LOG_CHANNEL: stderr
            DB_CONNECTION: sqlite
            DB_DATABASE: /var/www/html/database/data/database.sqlite
            SESSION_DRIVER: array
            CACHE_STORE: file
            QUEUE_CONNECTION: sync
        volumes:
            - ./database/data:/var/www/html/database/data

    nginx:
        image: nginx:1.27-alpine
        container_name: enem-study-api-nginx
        restart: unless-stopped
        ports:
            - "${APP_PORT:-8080}:80"
        volumes:
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
            - ./public:/var/www/html/public:ro
        depends_on:
            - app
